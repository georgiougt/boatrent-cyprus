; Raise PHP's upload ceiling so guests can send a phone-length reel.
; Read by PHP-FPM / CGI hosts (Hostinger included) — on mod_php hosts set the
; same values in php.ini instead. Keep these ABOVE includes/config.php's
; REEL_MAX_MB, which is the limit the site actually enforces and displays.
upload_max_filesize = 80M
post_max_size = 88M
max_file_uploads = 4

; Big uploads over a slow hotel wifi need more than the default 30s.
max_execution_time = 300
max_input_time = 300
